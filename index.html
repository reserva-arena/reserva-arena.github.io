function vapidToUint8(base64String){
const padding='='.repeat((4-base64String.length%4)%4);
const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
const rawData=window.atob(base64);
const outputArray=new Uint8Array(rawData.length);
for(let i=0;i<rawData.length;++i)outputArray[i]=rawData.charCodeAt(i);
return outputArray;
}

function isDiaLetivo(data){
if(!data)return false;
const[a,m,d]=data.split("-").map(Number);
const dt=new Date(a,m-1,d),dow=dt.getDay();
if(dow===0||dow===6)return false;
if(NAO_LETIVOS.has(data))return false;
if(data<"2026-01-19"||data>"2026-12-10")return false;
return true;
}
function isDiaLetivoTurma(data,turma){
if(!isDiaLetivo(data))return false;
const a=parseInt(turma);
if(a>=1&&a<=5&&NAO_LETIVOS_INICIAIS.has(data))return false;
return true;
}
function diasLetivosAte(dataStr){
const agora=new Date();
const[a,m,d]=dataStr.split("-").map(Number);
const alvo=new Date(a,m-1,d,7,10,0);
let count=0;
const cur=new Date(agora);cur.setHours(0,0,0,0);
cur.setDate(cur.getDate()+1); // conta a partir de AMANHÃ — hoje não conta como dia de antecedência
const fim=new Date(alvo);fim.setHours(0,0,0,0);
while(cur<fim){
const ds=`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}-${String(cur.getDate()).padStart(2,"0")}`;
if(isDiaLetivo(ds))count++;
cur.setDate(cur.getDate()+1);
}
return count;
}
function isUrgente(data,horario){
try{
const agora=new Date();
const[a,m,d]=data.split("-").map(Number);
const[h,mn]=horario.split(":").map(Number);
const ev=new Date(a,m-1,d,h,mn);
const diff=(ev-agora)/3600000;
if(diff<=0)return false;
if(diff<24)return true;
if(diasLetivosAte(data)<1)return true;
return false;
}catch{return false;}
}
// ── Fim de semana / decisão se a pendência precisa de ação do Admin ──
function isFds(data){
try{const[a,m,d]=data.split("-").map(Number);const dow=new Date(a,m-1,d).getDay();return dow===0||dow===6;}catch{return false;}
}
function precisaAdmin(r){
if(isUrgente(r.data,r.horario)||isFds(r.data))return true;
// Reserva pendente sem urgência/fim de semana, mas que NUNCA teve componente de T.I. nem de
// Marketing associado (ex: bloqueio de espaço criado direto pelo Admin, sem equipamento/mídia) —
// ninguém mais vai confirmar isso sozinho, então precisa do Admin mesmo.
// Importante: olha se o CAMPO existe (teve o componente em algum momento), não só se está "pendente"
// agora — senão quebraria a auto-confirmação de quando T.I./Marketing acabaram de resolver a parte deles.
if(r.status==="pendente"&&!temComponenteTI(r)&&!temComponenteMkt(r))return true;
return false;
}
function temComponenteTI(r){
if(r.statusEquip!==undefined)return true;
const eo=ESPACOS.find(e=>e.nome===r.espaco);
return eo?.tipo==="audiovisual";
}
function temComponenteMkt(r){
return r.statusMarketing!==undefined;
}
// Após T.I. ou Marketing aprovar/recusar sua parte, verifica se a reserva do espaço
// pode ser confirmada automaticamente (quando o Admin não precisa agir: não é urgente nem fim de semana,
// e todas as aprovações necessárias — equipamento/mídia — já foram resolvidas).
// Retorna o status final do ESPAÇO ("confirmado" ou "pendente") para uso nas mensagens.
async function tentarConfirmarAuto(rAtual){
try{
if(!rAtual)return"pendente";
if(rAtual.status!=="pendente")return rAtual.status;
if(precisaAdmin(rAtual))return"pendente";
const equipOk=rAtual.statusEquip===undefined||rAtual.statusEquip==null||rAtual.statusEquip!=="pendente";
const midiaOk=rAtual.statusMarketing===undefined||rAtual.statusMarketing==null||rAtual.statusMarketing!=="pendente";
if(equipOk&&midiaOk){
await updateDoc(doc(db,"reservas",rAtual.id),{status:"confirmado"});
return"confirmado";
}
return"pendente";
}catch(e){console.error("tentarConfirmarAuto:",e);return rAtual?.status||"pendente";}
}
// Frase clara sobre a situação do ESPAÇO, independente do que houve com equipamento/mídia —
// usada nas notificações pro professor e pro admin.
function fraseSituacaoEspaco(statusFinal){
return statusFinal==="confirmado"
?"A reserva do espaço está confirmada e disponível normalmente."
:"A reserva do espaço ainda depende da aprovação do Admin (agendamento com menos de 24h ou em fim de semana).";
}
// ── Blindagem contra picos de uso (cota do Firestore, instabilidade momentânea) ──
// Detecta erros transitórios (cota do dia estourada, indisponibilidade, timeout) que valem retry automático,
// diferente de erros de programação/permissão que não adianta tentar de novo.
function isErroTransitorio(e){
const code=e?.code||"";
const msg=(e?.message||"").toLowerCase();
return code==="resource-exhausted"||code==="unavailable"||code==="deadline-exceeded"||code==="aborted"||msg.includes("timeout")||msg.includes("quota");
}

function isDiaUrgente(data){
try{
const agora=new Date();
const[a,m,d]=data.split("-").map(Number);
const ev=new Date(a,m-1,d,7,10,0);
const diff=(ev-agora)/3600000;
if(diff<=0)return false;
if(diff<24)return true;
if(diasLetivosAte(data)<1)return true;
return false;
}catch{return false;}
}
function addDias(s,n){
const[a,m,d]=s.split("-").map(Number);
const dt=new Date(Date.UTC(a,m-1,d+n));
return dt.toISOString().split("T")[0];
}
function getSegunda(s){
const[a,m,d]=s.split("-").map(Number);
const dt=new Date(Date.UTC(a,m-1,d));
const dow=dt.getUTCDay();
return addDias(s,dow===0?-6:1-dow);
}

// ─── CALENDÁRIO MENSAL ────────────────────────────────────────────────────────
function calMensalHTML(cid,ano,mes,porData,dataSel){
const c=C(),h=fmtHoje();
const mob=window.innerWidth<768;
const primeiroDia=new Date(Date.UTC(ano,mes,1));
const diasNoMes=new Date(Date.UTC(ano,mes+1,0)).getUTCDate();
const inicioGrid=primeiroDia.getUTCDay();
const cells=[];for(let i=0;i<inicioGrid;i++)cells.push(null);for(let d=1;d<=diasNoMes;d++)cells.push(d);
let dias="";
cells.forEach((d,i)=>{
const dowVazia=i%7;
if(!d){if(mob&&(dowVazia===0||dowVazia===6))return;dias+=`<div></div>`;return;}
const ds=`${ano}-${String(mes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const isH=ds===h,isPast=ds<h,isSel=ds===dataSel,letivo=isDiaLetivo(ds);
const dow=new Date(Date.UTC(ano,mes,d)).getUTCDay(),isFim=dow===0||dow===6;
if(mob&&(dow===0||dow===6))return;
const nao=!letivo&&!isPast;
const bg=isSel?"#40b07a":isH?"rgba(26,107,71,.12)":nao?"rgba(239,68,68,.08)":"transparent";
const col=isSel?"#fff":isPast?"#cbd5e1":nao?"#fca5a5":isFim?"#ef4444":c.navy;
const temRes=(porData[ds]||[]).length>0;
dias+=isPast?`<div style="aspect-ratio:1;width:6px;height:6px;border-radius:50%;background:#cbd5e1;opacity:.3;margin:auto"></div>`:`<button onclick="window._calClick('${cid}','${ds}')" ${!letivo?"disabled":""}
     style="aspect-ratio:1;border-radius:8px;border:none;cursor:${!letivo?"not-allowed":"pointer"};background:${bg};color:${col};font-weight:${isH||isSel?800:500};font-size:13.5px;position:relative;opacity:1;transition:all .15s;font-family:inherit">
     ${d}${temRes&&!isSel?`<div style="position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#40b07a"></div>`:""}
   </button>`;
});
const cols=mob?"repeat(5,1fr)":"repeat(7,1fr)";
const labels=mob?["S","T","Q","Q","S"]:["D","S","T","Q","Q","S","S"];
return`<div style="background:${c.surface};border-radius:16px;border:1px solid ${c.border};overflow:hidden">
   <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid ${c.border}">
     <button onclick="window._calNav('${cid}',-1)" style="background:none;border:1px solid ${c.border};border-radius:8px;width:34px;height:34px;cursor:pointer;color:${c.textMid};font-size:16px;font-family:inherit">‹</button>
     <div style="text-align:center"><p style="font-size:17px;font-weight:800;color:${c.navy}">${MESES[mes]}</p><p style="font-size:12px;color:${c.textMuted}">${ano}</p></div>
     <button onclick="window._calNav('${cid}',1)" style="background:none;border:1px solid ${c.border};border-radius:8px;width:34px;height:34px;cursor:pointer;color:${c.textMid};font-size:16px;font-family:inherit">›</button>
   </div>
   <div style="padding:12px 16px 16px">
     <div style="display:grid;grid-template-columns:${cols};margin-bottom:6px">
       ${labels.map((n,i)=>`<div style="text-align:center;font-size:10px;font-weight:700;color:${!mob&&(i===0||i===6)?"#ef4444":c.textMuted};padding:4px 0">${n}</div>`).join("")}
     </div>
     <div style="display:grid;grid-template-columns:${cols};gap:3px">${dias}</div>
   </div>
 </div>`;
}

// ─── ESTADO GLOBAL ────────────────────────────────────────────────────────────
let _usuario=null,_todas=[],_minhas=[],_usuarios=[],_trocandoSenha=false;
let _unsub1=null,_unsub2=null,_unsub3=null,_unsubPend=null,_unsubMes=null,_unsubTI=null,_unsubMkt=null,_unsubTbTablets=null,_unsubTbNotebooks=null,_unsubMaker=null,_unsubLab=null;
let _tiGlobal=[],_mktGlobal=[],_tbGlobalTablets=[],_tbGlobalNotebooks=[],_tbGlobal=[],_makerGlobal=[],_labGlobal=[];
function mesclarTbGlobal(){
const porId={};
_tbGlobalTablets.forEach(r=>{porId[r.id]=r;});
_tbGlobalNotebooks.forEach(r=>{porId[r.id]=r;});
_tbGlobal=Object.values(porId);
}
// Agrupa uma lista de reservas (já ordenada) por dia, com um cabeçalho destacado por data
// (hoje fica verde, os demais dias cinza) — usado nas filas de T.I./Marketing/Tablets.
function agruparPorDiaHTML(lista,cardFn,hoje){
if(!lista.length)return"";
const porDia={};
lista.forEach(r=>{if(!porDia[r.data])porDia[r.data]=[];porDia[r.data].push(r);});
let h="";
Object.keys(porDia).sort().forEach(data=>{
const isH=data===hoje;
const[a,m,d]=data.split("-");
h+=`<div style="margin-bottom:14px"><div style="background:${isH?"#1a6b47":"#64748b"};color:#fff;border-radius:7px;padding:3px 12px;font-size:11.5px;font-weight:700;display:inline-block;margin-bottom:8px">${isH?"📌 Hoje":`${d}/${m}/${a}`}</div>`;
porDia[data].forEach(r=>{h+=cardFn(r);});
h+="</div>";
});
return h;
}
// Busca uma reserva em todas as fontes conhecidas — necessário porque as filas de aprovação
// de T.I./Marketing/Tablets agora enxergam itens fora do mês carregado em _todas.
function buscarReservaGlobal(id){
return _todas.find(r=>r.id===id)||_tiGlobal.find(r=>r.id===id)||_mktGlobal.find(r=>r.id===id)||_tbGlobal.find(r=>r.id===id)||_makerGlobal.find(r=>r.id===id)||_labGlobal.find(r=>r.id===id)||null;
}
// Alerta sonoro do T.E. (Tablets/Notebooks): bipe periódico enquanto houver pendência
// e o admin não estiver na aba, gerado via Web Audio API (sem depender de arquivo externo).
let _tbAlertTimer=null,_tbAudioCtx=null;
function tbAlertTick(){
try{
if(!_tbAudioCtx)_tbAudioCtx=new(window.AudioContext||window.webkitAudioContext)();
const ctx=_tbAudioCtx;
if(ctx.state==="suspended")ctx.resume();
[0,0.22].forEach(delay=>{
const osc=ctx.createOscillator(),gain=ctx.createGain();
osc.type="sine";osc.frequency.value=880;
gain.gain.setValueAtTime(0.001,ctx.currentTime+delay);
gain.gain.exponentialRampToValueAtTime(0.18,ctx.currentTime+delay+0.02);

const corSala=nome=>nome==="Maker 1"?"#7c3aed":"#0284c7";
const makerCard=r=>{
const statusBadge=r.status==="pendente"?`<span style="background:#f97316;color:#fff;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px">Pendente</span>`:r.status==="confirmado"?`<span style="background:#1a6b47;color:#fff;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px">Confirmado</span>`:"";
return`<div style="background:${c.surface};border:1.5px solid ${c.border};border-left:4px solid ${corSala(r.espaco)};border-radius:10px;padding:12px 14px;margin-bottom:8px">
   <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px">
     <span style="font-family:'DM Mono',monospace;font-weight:800;color:${c.green}">${r.horario}${r.horarioFim&&r.horarioFim!==r.horario?" → "+r.horarioFim:""}</span>
     <span style="background:${corSala(r.espaco)};color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px">${r.espaco}</span>
     ${statusBadge}
   </div>
   <p style="font-size:13px;color:${c.textMid}">${r.professor} · ${r.turma||"—"}</p>
   ${r.conteudo?`<p style="font-size:12px;color:${c.textMuted};margin-top:3px">📝 ${r.conteudo}</p>`:""}
   <div style="margin-top:10px"><button onclick="abrirEdicao('${r.id}')" style="padding:7px 16px;border-radius:8px;border:1.5px solid ${c.border};background:transparent;color:${c.textMid};font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">✏️ Editar / Mover de sala</button></div>
 </div>`;
};
const todosOrdenados=[..._makerGlobal].sort((a,b)=>a.data>b.data?1:a.data<b.data?-1:a.horario>b.horario?1:-1);
const hojeList=todosOrdenados.filter(r=>r.data===h);
const proximosList=todosOrdenados.filter(r=>r.data>h);
if(!window._MAKER)window._MAKER={aba:"hoje"};
const btnAba=(id,l)=>`<button onclick="window._MAKER.aba='${id}';re()" style="padding:7px 16px;font-size:12.5px;border-radius:8px;border:1.5px solid ${_MAKER.aba===id?'#7c3aed':c.border};background:${_MAKER.aba===id?'#7c3aed':'transparent'};color:${_MAKER.aba===id?'#fff':c.text};font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">${l}</button>`;
let corpo="";
if(_MAKER.aba==="hoje"){
if(hojeList.length)corpo+=hojeList.map(makerCard).join("");
else corpo+=`<div style="text-align:center;padding:48px;color:${c.textMuted}"><p style="font-size:40px">🔨</p><p style="margin-top:12px">Nenhum agendamento hoje.</p></div>`;
} else if(_MAKER.aba==="proximos"){
if(!proximosList.length)corpo+=`<div style="text-align:center;padding:48px;color:${c.textMuted}"><p style="font-size:40px">📅</p><p style="margin-top:12px">Nada agendado pros próximos dias.</p></div>`;
else{
const pd={};proximosList.forEach(r=>{if(!pd[r.data])pd[r.data]=[];pd[r.data].push(r);});
Object.entries(pd).forEach(([data,rs])=>{const[a2,m2,d2]=data.split("-");corpo+=`<div style="margin-bottom:16px"><p style="font-size:12px;font-weight:800;color:${c.textMuted};text-transform:uppercase;margin-bottom:8px">${d2}/${m2}/${a2}</p>${rs.map(makerCard).join("")}</div>`;});
}
} else {
if(!todosOrdenados.length)corpo+=`<div style="text-align:center;padding:48px;color:${c.textMuted}"><p style="font-size:40px">🔨</p><p style="margin-top:12px">Nenhum agendamento.</p></div>`;
else corpo+=todosOrdenados.map(makerCard).join("");
}
$("app").innerHTML=`<div style="min-height:100vh;background:${c.bg}" translate="no">
   <header style="background:${_dark?c.headerBg:"linear-gradient(135deg,#4c1d95,#7c3aed)"};padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100">
     <div style="display:flex;align-items:center;gap:8px">${logoHTML(36)}<p style="font-size:13px;font-weight:800;color:#fff">🔨 Maker</p></div>
     <div style="display:flex;align-items:center;gap:6px">${avatarHTML(_usuario?.nome,28,"purple")}<button onclick="toggleDark()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:700">${_dark?"☀️":"🌙"}</button><button onclick="doSignOut()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:700">Sair</button></div>
   </header>
   <div class="desktop-zoom" style="max-width:1000px;margin:0 auto;padding:16px 14px">
     <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${btnAba("hoje",`📅 Hoje · ${hojeList.length}`)}${btnAba("proximos","🔜 Próximos dias")}${btnAba("todos","📅 Todos agendamentos")}</div>
     ${corpo}
   </div>
   ${modalEdicaoHTML()}
 </div>`;
}

function renderMarketing(){
const c=C(),h=fmtHoje();
if(!window._MK)window._MK={aba:"pendentes",historico:false};
const mkCard=(r,pend)=>{
const[a,m2,d]=r.data.split("-");const isH=r.data===h;
const dias=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const dow=dias[new Date(r.data+"T12:00:00").getDay()];
const midiaTags=(r.precisaFoto?`<span style="background:#f5f3ff;color:#7c3aed;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid #ddd6fe">📸 Foto</span>`:"")+(r.precisaVideo?`<span style="background:#eff6ff;color:#1d4ed8;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid #bfdbfe">🎬 Vídeo</span>`:"")+(r.bibMic>0?`<span style="background:#e0f2fe;color:#0369a1;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid #bae6fd">🎤 ${r.bibMic} mic</span>`:"")+(r.bibCaixa>0?`<span style="background:#e0f2fe;color:#0369a1;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid #bae6fd">🔊 ${r.bibCaixa} cx</span>`:"")+(r.bibProj>0?`<span style="background:#e0f2fe;color:#0369a1;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid #bae6fd">📽️ ${r.bibProj} proj</span>`:"")+(r.recorrente?`<span style="background:#eff6ff;color:#1d4ed8;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid #bfdbfe">🔁</span>`:"");
const objTag=r.objetivoMidia?`<span style="background:#fef9c3;color:#854d0e;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid #fde68a">${r.objetivoMidia==="social"?"📱 Rede Social":"📚 Pedagógico"}</span>`:"";
// Um agendamento de vários horários seguidos gera 1 registro principal + registros "[Auto]" pra
// cada horário extra. Pra quem vai tirar foto/filmar, isso é UM pedido só — junta todos os horários
// desse grupo aqui pra deixar escolher qual horário consegue atender (não precisa estar disponível a manhã toda).
const grupoHorarios=[r.horario,..._todas.filter(a=>a.reservaAutomatica&&a.espaco===r.espaco&&a.data===r.data&&a.professorId===r.professorId).map(a=>a.horario)].filter((v,i,arr)=>v&&arr.indexOf(v)===i).sort();
const temVarios=grupoHorarios.length>1;
if(!window._MK.sel)window._MK.sel={};
if(!_MK.sel[r.id])_MK.sel[r.id]={horario:(pend?(grupoHorarios[0]||r.horario):(r.fotografoHorario||r.horario)),obs:pend?"":(r.fotografoObs||"")};
return`<div style="background:${c.surface};border-radius:12px;border:1.5px solid ${pend?"#ddd6fe":"#a7f3d0"};padding:14px 18px;margin-bottom:10px;border-left:4px solid ${pend?"#7c3aed":"#1a6b47"}">
     <div style="display:flex;gap:14px;align-items:flex-start">
       <div style="text-align:center;min-width:52px;background:${pend?"#f5f3ff":"#e2f4ea"};border-radius:8px;padding:6px 8px">
         <p style="font-size:11px;font-weight:700;color:${pend?"#7c3aed":"#1a6b47"};text-transform:uppercase">${dow}</p>
         <p style="font-size:20px;font-weight:900;color:${pend?"#7c3aed":"#1a6b47"};line-height:1">${d}</p>
         <p style="font-size:10px;color:${pend?"#7c3aed":"#1a6b47"}">${m2}/${a.slice(2)}</p>
       </div>
       <div style="flex:1">
         <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px">
           <span style="font-family:'DM Mono',monospace;font-weight:800;color:${pend?"#7c3aed":"#1a6b47"};font-size:13px">${r.horario}${r.horarioFim&&r.horarioFim!==r.horario?" → "+r.horarioFim:""}</span>
           <span style="font-size:13px;font-weight:700;color:${c.navy}">${r.espaco==="Equipe de Marketing"?(r.salaAtividade||"Sala não informada"):r.espaco}</span>
           ${isH?`<span style="background:#1a6b47;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px">📌 Hoje</span>`:""}
           ${!pend&&r.fotografoHorario?`<span style="background:#e2f4ea;color:#1a6b47;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px">📍 Vai às ${r.fotografoHorario}</span>`:""}
         </div>
         <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">${midiaTags}${objTag}</div>
         <p style="font-size:12px;color:${c.textMid};margin-bottom:2px">👤 ${r.professor} · ${r.turmaInicio||r.turma||"—"}</p>
         <p style="font-size:12px;color:${c.textMuted}">${r.conteudo}</p>
         ${r.descritivo?`<div style="margin-top:6px;padding:8px 10px;background:#fef9c3;border-radius:6px;border:1px solid #fde68a"><p style="font-size:11px;font-weight:700;color:#854d0e;margin-bottom:2px">📝 Publicação:</p><p style="font-size:12px;color:#713f12">${r.descritivo}</p></div>`:""}
       </div>
     </div>
     ${temVarios&&r.objetivoMidia==="social"?`<div style="margin-top:10px;padding:10px;background:${pend?"#f5f3ff":"#e2f4ea"};border-radius:8px;border:1px solid ${pend?"#ddd6fe":"#a7f3d0"}">
       <p style="font-size:11px;font-weight:700;color:${pend?"#7c3aed":"#1a6b47"};margin-bottom:6px">⏰ Esse pedido cobre vários horários seguidos — em qual você consegue estar?${!pend?" (imprevisto? pode trocar aqui a qualquer momento)":""}</p>
       <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:${pend?"0":"8px"}">
         ${grupoHorarios.map(hr=>`<label style="display:flex;align-items:center;gap:5px;background:${_MK.sel[r.id].horario===hr?(pend?'#7c3aed':'#1a6b47'):'#fff'};color:${_MK.sel[r.id].horario===hr?'#fff':(pend?'#4c1d95':'#166534')};border:1.5px solid ${pend?'#ddd6fe':'#a7f3d0'};border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer"><input type="radio" name="mk-hr-${r.id}" value="${hr}" ${_MK.sel[r.id].horario===hr?"checked":""} onchange="window._MK.sel['${r.id}'].horario=this.value;re()" style="display:none">${hr}</label>`).join("")}
       </div>
       ${!pend?`<button onclick="mkAtualizarHorario('${r.id}')" style="padding:7px 14px;border-radius:8px;border:none;background:#1a6b47;color:#fff;font-weight:700;font-size:12px;cursor:pointer">💾 Atualizar horário</button>`:""}
     </div>`:temVarios?`<div style="margin-top:10px;padding:10px;background:#fef9c3;border-radius:8px;border:1px solid #fde68a">
       <p style="font-size:11.5px;font-weight:700;color:#854d0e">📚 Pedagógico — esse pedido cobre várias turmas (${grupoHorarios.join(", ")}). Diferente da Rede Social, aqui é pra acompanhar <strong>todas</strong>, não só passar em uma.</p>
     </div>`:""}
     ${pend?`<div style="margin-top:10px">
       <label style="font-size:11px;font-weight:700;color:${c.textMuted};text-transform:uppercase">Observação (opcional)</label><br>
       <textarea rows="2" placeholder="Ex: vou chegar com uns minutos de atraso, ou motivo da recusa..." oninput="window._MK.sel['${r.id}']=window._MK.sel['${r.id}']||{horario:'${r.horario}'};window._MK.sel['${r.id}'].obs=this.value" style="width:100%;margin-top:4px;padding:8px 10px;border-radius:8px;border:1.5px solid ${c.border};background:${c.surface};color:${c.text};font-size:12.5px;font-family:inherit;resize:vertical;box-sizing:border-box">${_MK.sel[r.id]?.obs||""}</textarea>
     </div>`:""}
     ${pend?`<div style="display:flex;gap:8px;margin-top:12px">
       <button onclick="mkAprovar('${r.id}')" style="flex:1;padding:9px;border-radius:8px;border:none;background:#1a6b47;color:#fff;font-weight:700;font-size:13px;cursor:pointer">✅ Aprovar</button>
       <button onclick="mkRecusar('${r.id}')" style="flex:1;padding:9px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-weight:700;font-size:13px;cursor:pointer">❌ Recusar</button>
     </div>`:`<div style="margin-top:10px"><button onclick="mkRecusar('${r.id}')" style="padding:7px 18px;border-radius:8px;border:1.5px solid #fca5a5;background:#fff;color:#dc2626;font-weight:700;font-size:12px;cursor:pointer">❌ Cancelar aprovação</button></div>`}
   </div>`;
};
// Filtro por aba
const minhas=_todas.filter(r=>(r.precisaFoto||r.precisaVideo||r.espaco==="Equipe de Marketing")&&(_MK.historico||r.data>=h)&&r.status!=="recusado"&&!r.reservaAutomatica).sort((a,b)=>a.data>b.data?1:a.data<b.data?-1:a.horario>b.horario?1:-1);
const hojeList=minhas.filter(r=>r.data===h);
const pendentes=minhas.filter(r=>r.statusMarketing==="pendente"&&r.data>=h);
const mkPVenc=minhas.filter(r=>r.statusMarketing==="pendente"&&r.data<h);
const proximosList=minhas.filter(r=>r.data>h);
const todos=_todas.filter(r=>(_MK.historico||r.data>=h)&&r.status!=="recusado"&&!r.reservaAutomatica).sort((a,b)=>a.data>b.data?1:a.data<b.data?-1:a.horario>b.horario?1:-1);
const btnAba=(id,l)=>`<button onclick="window._MK.aba='${id}';re()" style="padding:7px 16px;font-size:12.5px;border-radius:8px;border:1.5px solid ${_MK.aba===id?'#7c3aed':c.border};background:${_MK.aba===id?'#7c3aed':'transparent'};color:${_MK.aba===id?'#fff':c.text};font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">${l}</button>`;
let corpo="";
if(_MK.aba==="hoje"){
if(hojeList.length)corpo+=hojeList.map(r=>mkCard(r,r.statusMarketing==="pendente")).join("");
else corpo+=`<div style="text-align:center;padding:48px;color:${c.textMuted}"><p style="font-size:40px">📸</p><p style="margin-top:12px;font-size:14px">Nenhuma solicitação hoje.</p></div>`;
} else if(_MK.aba==="pendentes"){
if(mkPVenc.length)corpo+=`<div style="margin-bottom:16px"><p style="font-size:12px;font-weight:800;color:#dc2626;text-transform:uppercase;margin-bottom:10px">⚠️ Vencidos — nunca aprovados (${mkPVenc.length})</p>${mkPVenc.map(r=>mkCard(r,true)).join("")}</div>`;
if(pendentes.length)corpo+=pendentes.map(r=>mkCard(r,true)).join("");
if(!pendentes.length&&!mkPVenc.length)corpo+=`<div style="text-align:center;padding:48px;color:${c.textMuted}"><p style="font-size:40px">🎉</p><p style="margin-top:12px;font-size:14px">Nenhum pendente.</p></div>`;
} else if(_MK.aba==="proximos"){

// Função de limpeza — use no console: limparHorariosTravados("Lab. de Matemática","2026-06-17")
window.limparHorariosTravados=async(espaco,data)=>{
const snap=await getDocs(query(collection(db,"reservas"),where("espaco","==",espaco),where("data","==",data)));
if(!snap.docs.length){console.log("Nenhuma reserva encontrada");return;}
const b=writeBatch(db);
snap.docs.forEach(d=>b.delete(doc(db,"reservas",d.id)));
await b.commit();
console.log(`✅ ${snap.docs.length} reservas removidas de ${espaco} em ${data}`);
};
window.cancelarR=async id=>{
if(!confirm("Cancelar esta reserva?"))return;
// Busca em _minhas primeiro (sempre completo, sem limite de data) — _todas pode estar vazio pro professor
const r=_minhas.find(r=>r.id===id)||_todas.find(r=>r.id===id);
if(!r){await deleteDoc(doc(db,"reservas",id));return;}
// Deletar reserva principal
const b=writeBatch(db);
b.delete(doc(db,"reservas",id));
// Deletar todas as reservas automáticas do mesmo espaco+data+professor — busca em _minhas+_todas
// combinados (sem isso, um documento auxiliar de equipamento pode ficar "fantasma", contando
// como horário ocupado pra sempre mesmo depois do cancelamento).
const siblingsMap={};
[..._minhas,..._todas].forEach(a=>{
if(a.reservaAutomatica&&a.espaco===r.espaco&&a.data===r.data&&a.professorId===r.professorId)siblingsMap[a.id]=a;
});
Object.keys(siblingsMap).forEach(aid=>b.delete(doc(db,"reservas",aid)));
await b.commit();
// Avisar os admins que o professor cancelou
try{
const dataFmt=r.data.split("-").reverse().join("/");
const range=r.horarioFim&&r.horarioFim!==r.horario?` → ${r.horarioFim}`:"";
_usuarios.filter(u=>u.perfil==="admin").forEach(u=>
gravarNotif(u.uid,"🗑️ Professor cancelou agendamento",`${r.professor||_usuario?.nome||"Professor"} cancelou "${r.espaco}" — ${dataFmt} às ${r.horario}${range}`,"info")
);
}catch(e){console.warn("notif cancelarR:",e);}
};

// ─── EXPORTAR AGENDAMENTO PARA .ICS (Adicionar ao Calendário) ─────────────
// Função isolada: só lê dados já existentes de _MA, não escreve nada no Firestore.
function escapeICS(str){
return (str||"").toString().replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
}
function icsDataHora(dataStr,horaStr,addMin){
// Goiânia/Brasília não tem horário de verão desde 2019, offset fixo -03:00
const dt=new Date(`${dataStr}T${horaStr}:00-03:00`);
if(addMin)dt.setMinutes(dt.getMinutes()+addMin);
return dt.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
}
window.gerarICS=function(){
const m=_MA;
const b0=m.blocos?.[0];
if(!m.data||!b0)return;
const horaIni=b0.horario||"07:10";
const horaFimSel=b0.horarioFim&&b0.horarioFim!==horaIni?b0.horarioFim:null;
const dtStart=icsDataHora(m.data,horaIni,0);
// Duração aproximada de 50min por período (aula padrão) — apenas para lembrete, não bloqueia a agenda de outros
const dtEnd=horaFimSel?icsDataHora(m.data,horaFimSel,50):icsDataHora(m.data,horaIni,50);
const turmasSucesso=b0.turmasPorHorario?Object.values(b0.turmasPorHorario).filter(Boolean):[b0.turma||""].filter(Boolean);
const turmaTxt=turmasSucesso.filter(Boolean).join(", ");
const titulo=`Reserva Arena: ${m.espaco}${turmaTxt?" · "+turmaTxt:""}`;
const uid=`reserva-${Date.now()}@reserva-arena.github.io`;
const nowStamp=icsDataHora(new Date().toISOString().slice(0,10),new Date().toTimeString().slice(0,5),0);
const linhas=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Reserva Arena//PT-BR","CALSCALE:GREGORIAN","BEGIN:VEVENT",`UID:${uid}`,`DTSTAMP:${nowStamp}`,`DTSTART:${dtStart}`,`DTEND:${dtEnd}`,`SUMMARY:${escapeICS(titulo)}`,`DESCRIPTION:${escapeICS(b0.conteudo||"")}`,`LOCATION:${escapeICS(m.espaco||"")}`,"END:VEVENT","END:VCALENDAR"];
const blob=new Blob([linhas.join("\r\n")],{type:"text/calendar;charset=utf-8"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;a.download=`reserva-arena-${m.data}.ics`;
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url),1500);
};
// Alternativa via link (funciona em qualquer navegador, inclusive Chrome no iPhone,
// onde o download do .ics não abre o app Calendário automaticamente)

const m=_MA;

const turmasSucesso=b0.turmasPorHorario?Object.values(b0.turmasPorHorario).filter(Boolean):[b0.turma||""].filter(Boolean);
const turmaTxt=turmasSucesso.filter(Boolean).join(", ");

function maBlocoMultiHTML(b,i,eo){
const c=C(),m=_MA;

if(r.horarioFim&&r.horarioFim!==r.horario)return horariosRange(r.horario,r.horarioFim);
return[r.horario];
});
// Bloqueios fixos por espaço (seg-sex)

{espaco:"Sala de Dança",inicio:"11:45",fim:"13:45",label:"🌙 Soninho"}
];
const [ano2,mes2,dia2]=(_MA.data||"2000-01-01").split("-").map(Number);

const isDiaUtil=dowData>=1&&dowData<=5;
const isBloqueado=(h)=>{
if(m.espaco==="Sala de Dança"&&isDiaUtil){
const [hh,mm]=h.split(":").map(Number);
const minutos=hh*60+mm;
return minutos>=11*60+45&&minutos<13*60+45;
}
return false;
};

let parou=false;
for(let idx=iIni+1;idx<HORARIOS.length;idx++){
const horAtual=HORARIOS[idx];
if(ocpFire.includes(horAtual)||isBloqueado(horAtual)){parou=true;break;}
dispFim.push(horAtual);
}
// 17:40 é o horário real de término do último período do dia (que começa às 17:00) —

const bValMulti=b=>{

// ─── SALVAR AGENDAMENTO ───────────────────────────────────────────────────
window.maSalvar=async(isRetry=false)=>{
// Trava contra clique duplo/rápido: se já está salvando (e isso não é o próprio retry
// automático/manual chamando de novo), ignora — evita duplicar a reserva.
if(_MA.salvando&&!isRetry)return;
// Bloquear se precisaCiencia e checkbox não marcado
const chkCiente=document.getElementById('chk-ciente');
if(chkCiente&&!chkCiente.checked){
alert('Marque a caixa de ciência antes de confirmar.');
return;
}
if(!isRetry){_MA._tentativas=0;_MA._escritaIniciada=false;}
_MA.salvando=true;_MA.erro="";re();
const{espaco,data,blocos}=_MA;
const eo=ESPACOS.find(e=>e.nome===espaco);

try{
const b=blocos[0];
const rangeHors=horariosRange(b.horario,b.horarioFim);

// 1. Verificar conflitos de espaço (mesmo espaço, mesmo horário)
const snapConflitos=await Promise.all(rangeHors.map(h=>
getDocs(query(collection(db,"reservas"),where("espaco","==",espaco),where("data","==",data),where("horario","==",h)))
));
for(let i=0;i<rangeHors.length;i++){
const existe=snapConflitos[i].docs.map(d=>d.data()).find(r=>r?.status!=="recusado");
if(existe){_MA.erro=`Horário ${rangeHors[i]} já reservado por ${existe.professor}.`;_MA.salvando=false;_MA.resumo=false;re();return;}
}

// 1b. Verificar se o próprio professor já tem algo marcado nesse horário, em outro espaço
// (coordenador pode reservar mais de um espaço ao mesmo tempo — pula essa checagem pra esse perfil)
if(!isCoordenador(_usuario?.perfil)){
const snapConflitosProf=await Promise.all(rangeHors.map(h=>
getDocs(query(collection(db,"reservas"),where("professorId","==",_usuario.uid),where("data","==",data),where("horario","==",h)))
));
for(let i=0;i<rangeHors.length;i++){
const existeProf=snapConflitosProf[i].docs.map(d=>d.data()).find(r=>r?.status!=="recusado"&&r.espaco!==espaco);
if(existeProf){_MA.erro=`Você já tem "${existeProf.espaco}" agendado às ${rangeHors[i]} nesse mesmo dia.`;_MA.salvando=false;_MA.resumo=false;re();return;}
}
}

// 1b2. Laboratorista é compartilhado entre os dois labs de ciências — não pode
// estar escalado nos dois ao mesmo tempo
if(eo?.tipo==="laboratorio"&&b.laboratorista==="Sim"){
const LABS_CIENCIAS=["Lab. de Ciências Anos Iniciais","Lab. de Ciências Anos Finais"];
const outroLab=LABS_CIENCIAS.find(nome=>nome!==espaco);
const snapLab=await Promise.all(rangeHors.map(h=>
getDocs(query(collection(db,"reservas"),where("espaco","==",outroLab),where("data","==",data),where("horario","==",h)))
));
for(let i=0;i<rangeHors.length;i++){
const conflitoLab=snapLab[i].docs.map(d=>d.data()).find(r=>r?.status!=="recusado"&&r.laboratorista==="Sim");
if(conflitoLab){_MA.erro=`O laboratorista já está escalado às ${rangeHors[i]} no ${outroLab} (${conflitoLab.professor}). Só é possível agendar o espaço sem o laboratorista nesse horário.`;_MA.salvando=false;_MA.resumo=false;re();return;}
}
}

// 1b. Verificar se o professor já tem outro ESPAÇO reservado nos mesmos horários
// (equipamentos avulsos não bloqueiam — professor pode ter sala + tablets no mesmo horário)
// Coordenador pula essa checagem também — pode reservar mais de um espaço ao mesmo tempo.
const isEquipAvulsoSalvar=eo?.equipAvulso;
if(!isEquipAvulsoSalvar&&!isCoordenador(_usuario?.perfil)){
const snapProfConflitos=await Promise.all(rangeHors.map(h=>
getDocs(query(collection(db,"reservas"),
where("professorId","==",_usuario.uid),
where("data","==",data),
where("horario","==",h),
where("reservaAutomatica","==",false)
))
));
for(let i=0;i<rangeHors.length;i++){
const conflito=snapProfConflitos[i].docs.map(d=>d.data()).find(r=>
r?.status!=="recusado"&&
r?.espaco!==espaco&&
!ESPACOS.find(e=>e.nome===r?.espaco)?.equipAvulso
);
if(conflito){
_MA.erro=`Você já tem o <strong>${conflito.espaco}</strong> reservado às <strong>${rangeHors[i]}</strong>. Confirme se este é o horário correto.`;
_MA.salvando=false;_MA.resumo=false;re();return;
}
}
}

// 2. Verificar disponibilidade de equipamentos automáticos por quantidade
const equipAuto=eo.equipAuto||[];
const qtdTablets=Number(blocos[0]?.qtdTablets)||0;
const qtdNotebooks=Number(blocos[0]?.qtdNotebooks)||0;
if(equipAuto.length>0&&(qtdTablets>0||qtdNotebooks>0)){
let usadoT=0,usadoN=0;
try{
const snapsEq=await Promise.all(rangeHors.map(h=>
getDocs(query(collection(db,"reservas"),
where("data","==",data),
where("horario","==",h),
where("status","in",["confirmado","pendente"])
))
));
snapsEq.forEach(snap=>{
snap.docs.forEach(d=>{
const r=d.data();
if(r.espaco&&r.espaco.includes("Tablet"))usadoT+=Number(r.quantidade)||Number(r.qtdTablets)||0;
if(r.espaco&&r.espaco.includes("Computador"))usadoN+=Number(r.quantidade)||Number(r.qtdNotebooks)||0;
if(Number(r.qtdTablets)>0)usadoT+=Number(r.qtdTablets);
if(Number(r.qtdNotebooks)>0)usadoN+=Number(r.qtdNotebooks);
});
});
}catch(e){/* falha silenciosa */}
const dispT=Math.max(0,18-usadoT);
const dispN=Math.max(0,16-usadoN);
if(qtdTablets>dispT){
_MA.erro=`Tablets insuficientes. Pedido: ${qtdTablets}, disponível: ${dispT}.`;
_MA.salvando=false;_MA.resumo=false;re();return;
}
if(qtdNotebooks>dispN){
_MA.erro=`Computadores insuficientes. Pedido: ${qtdNotebooks}, disponível: ${dispN}.`;
_MA.salvando=false;_MA.resumo=false;re();return;
}
}

// 3. Determinar status
const algUrgente=rangeHors.some(h=>isUrgente(data,h));
const[ano,mes,dia]=data.split("-").map(Number);
const dow=new Date(Date.UTC(ano,mes-1,dia)).getUTCDay();
const eoSalvar=ESPACOS.find(e=>e.nome===espaco);
const temMidia=blocos[0]?.precisaFoto||blocos[0]?.precisaVideo||eoSalvar?.tipo==="marketing";
const temAV=eoSalvar?.tipo==="audiovisual"||((_MA.bibAV===true)&&(_MA.bibMic>0||_MA.bibCaixa>0||_MA.bibProj>0));
// Tablets/notebooks: equipe T.E. (Admin), não T.I. — não seta statusEquip, só força pendente
// para o Admin aprovar diretamente (mesmo fluxo de "sem componente TI/Mkt" do precisaAdmin()).
const temTabletsNotebooks=qtdTablets>0||qtdNotebooks>0;
// Equipe de Marketing: sempre pendente (aguarda aprovação da equipe)
const statusMarketing=temMidia?"pendente":null;
// Pendente se: urgente, fim de semana, mídia solicitada, equipamento AV solicitado, OU tablets/notebooks (T.E.)
// Coordenador é isento das regras de urgente/fim de semana (mas NÃO das de T.I./Marketing/T.E.,
// que continuam valendo pra todo mundo igual — são regras de topo, não dependem de quem agenda).
const souCoordenadorSalvar=isCoordenador(_usuario?.perfil);
const st=((!souCoordenadorSalvar&&(algUrgente||dow===0||dow===6))||temMidia||temAV||temTabletsNotebooks)?"pendente":"confirmado";

const tph=b.turmasPorHorario||{};
const isEquipSalvar=eo?.tipo==="equipamento"||eo?.tipo==="audiovisual";
const ts=Timestamp.now();

// 4. Montar todos os documentos e salvar em batch (muito mais rápido)
const batch=writeBatch(db);

// Reserva principal
const dadosPrincipal={
professor:_usuario.nome,professorId:_usuario.uid,professorEmail:_usuario.email,
turma:isEquipSalvar?"":(tph[b.horario]||""),
turmaInicio:isEquipSalvar?"":(tph[b.horario]||""),
turmaFim:isEquipSalvar?"":(tph[b.horarioFim]||tph[b.horario]||""),
turmasPorHorario:tph,
espaco,data,horario:b.horario,horarioFim:b.horarioFim,
conteudo:b.conteudo,observacoes:b.observacoes||"",
local:b.local||"",localMontagem:b.local||"",localDevolucao:b.localDevolucao||"",
quantidade:eo?.tipo==="equipamento"?Number(b.quantidade):null,
microfones:Number(b.microfones)||0,caixasom:Number(b.caixasom)||0,projetor:Number(b.projetor)||0,
status:st,criadoEm:ts,precisaFoto:b.precisaFoto||false,precisaVideo:b.precisaVideo||false,objetivoMidia:b.objetivoMidia||"",descritivo:b.descritivo||"",salaAtividade:b.salaAtividade||"",...(statusMarketing?{statusMarketing}:{}),...(temAV?{statusEquip:"pendente"}:{}),...(_MA.bibAV===true?{bibMic:_MA.bibMic||0,bibCaixa:_MA.bibCaixa||0,bibProj:_MA.bibProj||0}:{}),
paginas:b.paginas||"",laboratorista:b.laboratorista||"",reservaAutomatica:false,
qtdTablets:Number(b.qtdTablets)||0,qtdNotebooks:Number(b.qtdNotebooks)||0,
};
batch.set(doc(collection(db,"reservas")),dadosPrincipal);

// Reservas automáticas (horários intermediários)
for(let idx=1;idx<rangeHors.length;idx++){
const hAtual=rangeHors[idx];
const turmaAtual=isEquipSalvar?"":(tph[hAtual]||"");
batch.set(doc(collection(db,"reservas")),{
...dadosPrincipal,
horario:hAtual,horarioFim:hAtual,
turma:turmaAtual,turmaInicio:turmaAtual,turmaFim:turmaAtual,
reservaAutomatica:true,conteudo:"[Auto] "+b.conteudo
});
}

// Equipamentos automáticos (Sala Multifuncional, Lab Mat)
for(const nomeEquip of equipAuto){
const qtd=nomeEquip.includes("Tablet")?Number(b.qtdTablets):Number(b.qtdNotebooks);
if(!qtd||qtd<=0)continue;
for(const h of rangeHors){
batch.set(doc(collection(db,"reservas")),{
professor:_usuario.nome,professorId:_usuario.uid,professorEmail:_usuario.email,
turma:tph[h]||"",espaco:nomeEquip,data,horario:h,horarioFim:h,
conteudo:`Vinculado à ${espaco} — ${b.conteudo}`,
quantidade:qtd,status:st,criadoEm:ts,
precisaFoto:false,observacoes:`Agendado automaticamente via ${espaco}`,
localMontagem:espaco,reservaAutomatica:true,paginas:"",laboratorista:"",
});
}
}

// A/V automático se bibAV=true
if(_MA.bibAV===true){
const avSnaps=await Promise.all(rangeHors.map(h=>
getDocs(query(collection(db,"reservas"),where("espaco","==","Som, Microfone e Projetor"),where("data","==",data),where("horario","==",h)))
));
rangeHors.forEach((h,idx)=>{
if(!avSnaps[idx].docs.find(d=>d.data()?.status!=="recusado")){
batch.set(doc(collection(db,"reservas")),{
professor:_usuario.nome,professorId:_usuario.uid,professorEmail:_usuario.email,
turma:tph[h]||"",espaco:"Som, Microfone e Projetor",data,horario:h,horarioFim:h,
conteudo:`A/V vinculado à ${espaco} — ${b.conteudo}`,
localMontagem:espaco,status:st,criadoEm:ts,precisaFoto:false,
paginas:"",laboratorista:"",quantidade:null,reservaAutomatica:true,
microfones:0,caixasom:0,projetor:0,observacoes:"Auto via "+espaco,
});
}
});
}

?"⚠️ O sistema está sobrecarregado e não deu pra confirmar se o agendamento foi salvo. Antes de tentar de novo, confira em 'Ver agendamentos' se ele já aparece lá (pra não duplicar). Seus dados também ficaram salvos aqui neste aparelho, caso precise reenviar. Se o problema persistir, o limite volta ao normal por volta das 4h da manhã."

window.admDayHover=function(ds,evt){
let tip=document.getElementById("adm-tip");
if(!tip){tip=document.createElement("div");tip.id="adm-tip";tip.className="adm-day-tooltip";document.body.appendChild(tip);}
const rs=_todas.filter(r=>r.data===ds&&r.status!=="recusado"&&!r.reservaAutomatica).sort((a,b)=>a.horario>b.horario?1:-1);
const c=C();const[a,m,d]=ds.split("-");
const ehPassado=ds<fmtHoje();
let html=`<p style="font-size:11px;font-weight:800;color:#1a6b47;margin-bottom:8px">${d}/${m}/${a}${!ehPassado||rs.length?` · ${rs.length} agendamento${rs.length!==1?"s":""}`:""}</p>`;
if(!rs.length&&ehPassado)html+=`<p style="font-size:11.5px;color:#94a3b8">📁 Dia já passado — dados de histórico não ficam pré-carregados.</p>`;
else if(!rs.length)html+=`<p style="font-size:12px;color:#607060">🎉 Dia livre</p>`;
else rs.slice(0,6).forEach(r=>{
const urg=isUrgente(r.data,r.horario);
const range=r.horarioFim&&r.horarioFim!==r.horario?` → ${r.horarioFim}`:"";
html+=`<div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #e2f0eb"><span style="font-size:11px;font-family:'DM Mono',monospace;font-weight:800;color:${urg?"#c2410c":"#40b07a"};min-width:80px">${r.horario}${range}</span><div><p style="font-size:12px;font-weight:700;color:#132318">${r.espaco}</p><p style="font-size:11px;color:#607060">${r.professor?.split(" ")[0]||""} · ${r.turmaInicio||r.turma}</p>${r.laboratorista?`<p style="font-size:10px;color:#0f4c2b;font-weight:700">🔬 ${r.laboratorista==="Sim"?"c/ lab.":"s/ lab."}</p>`:""}${equipBadgesCompacto(r)?`<p style="font-size:10px;color:#0369a1;font-weight:700">${equipBadgesCompacto(r)}</p>`:""}</div></div>`;
});
if(rs.length>6)html+=`<p style="font-size:10px;color:#607060;margin-top:6px">+${rs.length-6} mais</p>`;
tip.innerHTML=html;
const x=Math.min(evt.clientX+12,window.innerWidth-320),y=Math.min(evt.clientY+12,window.innerHeight-300);
tip.style.left=x+"px";tip.style.top=y+"px";tip.classList.add("show");
};

window.aModerar=async(id,status)=>{
if(!exigePermissao(['admin'])){alert('Acesso negado.');return;}
if(!confirm(`${status==="confirmado"?"Aprovar":"Recusar"} esta reserva?`))return;
const r=buscarReservaGlobal(id);
await updateDoc(doc(db,"reservas",id),{status});
if(r){
const dataFmt=r.data.split("-").reverse().join("/");
if(status==="confirmado"){
await gravarNotif(r.professorId,"✅ Agendamento aprovado",`${r.espaco} — ${dataFmt} às ${r.horario}`,"aprovacao");
} else {
await gravarNotif(r.professorId,"❌ Agendamento recusado",`${r.espaco} — ${dataFmt} às ${r.horario}`,"recusa");
}
}
};
window.aExcluir=async id=>{
if(!exigePermissao(['admin'])){alert('Acesso negado.');return;}
if(!confirm("Excluir esta reserva?"))return;
const r=buscarReservaGlobal(id);
if(!r){await deleteDoc(doc(db,"reservas",id));return;}
const b=writeBatch(db);
b.delete(doc(db,"reservas",id));
// Junta todas as fontes conhecidas pra achar documentos auxiliares de equipamento (evita
// deixar "fantasmas" que continuam contando como horário ocupado depois da exclusão).
const siblingsMap={};
[..._todas,..._tiGlobal,..._mktGlobal,..._tbGlobal,..._makerGlobal,..._labGlobal].forEach(a=>{
if(a.reservaAutomatica&&a.espaco===r.espaco&&a.data===r.data&&a.professorId===r.professorId)siblingsMap[a.id]=a;
});
Object.keys(siblingsMap).forEach(aid=>b.delete(doc(db,"reservas",aid)));
await b.commit();
};

window.guCadastroLote=async()=>{
if(!exigePermissao(['admin'])){alert('Acesso negado.');return;}
const raw=document.getElementById("gu-lote-input")?.value||"";
const senhaBase=document.getElementById("gu-lote-senha")?.value||"123456";
const perfil=document.getElementById("gu-lote-perfil")?.value||"professor";
const linhas=raw.split(/\n+/).map(l=>l.trim()).filter(Boolean);
const pessoas=linhas.map(l=>{
const partes=l.split("|").map(p=>p.trim());
return{nome:partes[0]||"",email:(partes[1]||"").toLowerCase()};
}).filter(p=>p.nome&&p.email);
const resEl=document.getElementById("gu-lote-resultado");
if(!pessoas.length){if(resEl)resEl.innerHTML=`<p style="font-size:12px;color:#dc2626">Nenhuma linha válida. Use o formato: Nome | email</p>`;return;}
if(senhaBase.length<6){if(resEl)resEl.innerHTML=`<p style="font-size:12px;color:#dc2626">Senha precisa ter pelo menos 6 caracteres.</p>`;return;}
if(!confirm(`Confirma o cadastro de ${pessoas.length} pessoa(s) com senha inicial "${senhaBase}"?`))return;
const btn=document.getElementById("gu-lote-btn");
if(btn){btn.disabled=true;btn.textContent="Cadastrando...";}
let sucesso=0,jaExistia=0,erro=0;
let log=[];
for(const p of pessoas){
try{
const cred=await createUserWithEmailAndPassword(secAuth,p.email,senhaBase);
await secAuth.signOut();
await setDoc(doc(db,"usuarios",cred.user.uid),{nome:p.nome,email:p.email,perfil,ativo:true,criadoEm:Timestamp.now()});
sucesso++;
log.push(`<div style="font-size:12px;color:#0a3d22;background:#e2f4ea;border:1px solid #86efac;border-radius:6px;padding:4px 10px;margin-bottom:3px">✅ ${p.nome} — ${p.email}</div>`);
}catch(e){
if(e.code==="auth/email-already-in-use"){
jaExistia++;
log.push(`<div style="font-size:12px;color:#7c2d12;background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:4px 10px;margin-bottom:3px">⏭️ ${p.nome} — já existia (pulado)</div>`);
}else{
erro++;

let _todasCarregadas=false;
let _unsubTodas=null;
let _paginaAtual=0,_carregadosAté=30;

let _todasCarregadasChave=null; // null=nada | 'broad'=tudo (janela 60d) | nome do espaço específico carregado
let _metricaUso=null,_metricaUsoCarregada=false;
async function carregarMetricaUso(){
if(_metricaUsoCarregada)return;
_metricaUsoCarregada=true;
try{
const snap=await getDoc(doc(db,"metricas_uso","hoje"));
if(snap.exists()){_metricaUso=snap.data();re();}
}catch(e){console.warn("carregarMetricaUso:",e);}

window.carregarTodas=function carregarTodas(espaco,diasExtras){
const chave=(espaco||"broad")+"|"+(diasExtras||0);
if(_todasCarregadas&&_todasCarregadasChave===chave)return;
// Carrega uma vez (não fica em tempo real) — evita que muitas sessões de
// professores fiquem escutando a coleção inteira pra sempre. O painel do
// admin (_unsubPend + _unsubMes, ver startListeners/assinarMesAdmin) continua
// em tempo real normalmente, pois são poucas sessões e é de lá que vem o
// toast de "novo agendamento".
// Se um espaço específico foi escolhido, busca só dele (bem mais barato que tudo).
// Senão, busca "tudo" mas limitado a uma janela de 60 dias pra frente — quem
// precisar ver mais longe pode escolher um espaço específico ou usar o Calendário
// e navegar (que busca sob demanda o mês, ver pNavMes).
let q;
if(espaco){
q=query(collection(db,"reservas"),where("espaco","==",espaco));
}else{
const hojeMenos=new Date();hojeMenos.setDate(hojeMenos.getDate()-7);
const dataCorte=hojeMenos.toISOString().slice(0,10);
const hojeMais=new Date();hojeMais.setDate(hojeMais.getDate()+60+(diasExtras||0));
const dataLimite=hojeMais.toISOString().slice(0,10);
q=query(collection(db,"reservas"),where("data",">=",dataCorte),where("data","<=",dataLimite));
}
getDocs(q).then(snap=>{
_todas=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r&&r.professor&&r.data&&r.horario);
_todasCarregadas=true;_todasCarregadasChave=chave;re();
}).catch(e=>{console.error("Erro ao carregar reservas:",e);});
}

// Toast de notificação em tempo real (sem gerar leitura extra — reaproveita o listener já ativo)
function mostrarToastNovoAgendamento(msg){
const existentes=document.querySelectorAll('.toast-novo-agendamento').length;
const div=document.createElement("div");

_mesAssinadoChave=chave;
if(_unsubMes){_unsubMes();_unsubMes=null;}
const hojeD=new Date();
const ehMesAtual=ano===hojeD.getFullYear()&&mes===hojeD.getMonth();
const inicio=ehMesAtual?fmtHoje():`${ano}-${String(mes+1).padStart(2,"0")}-01`;
const ultimoDiaNum=new Date(ano,mes+1,0).getDate();
const fim=`${ano}-${String(mes+1).padStart(2,"0")}-${String(ultimoDiaNum).padStart(2,"0")}`;
_unsubMes=onSnapshot(query(collection(db,"reservas"),where("data",">=",inicio),where("data","<=",fim)),snap=>{
_todasMes=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r&&r.professor&&r.data&&r.horario);
mesclarTodasAdmin();re();
});
};

// ── Verificação de nova versão publicada ──
// A cada poucos minutos, busca o próprio index.html (sem cache) e compara a tag <meta name="app-build">
// com a atual. Se mudou, mostra um aviso discreto — nunca recarrega sozinho, pra não interromper
// ninguém no meio de um formulário. A tag <meta name="app-build-perfis"> controla pra quem esse
// aviso é relevante ("todos", ou uma lista tipo "admin,ti,marketing,coordenador") — a maioria das
// atualizações não interessa pro professor, então cada deploy escolhe quem avisar.
const _BUILD_ATUAL=document.querySelector('meta[name="app-build"]')?.content||"";
let _versaoAvisada=false;
async function checarNovaVersao(){
if(_versaoAvisada)return;
try{
const resp=await fetch("/?_v="+Date.now(),{cache:"no-store"});
const texto=await resp.text();
const m=texto.match(/<meta name="app-build" content="([^"]*)"/);
const mPerfis=texto.match(/<meta name="app-build-perfis" content="([^"]*)"/);
const perfisAlvo=(mPerfis?.[1]||"todos").split(",").map(s=>s.trim());
const meuPerfil=_usuario?.perfil||"";
const relevante=perfisAlvo.includes("todos")
||perfisAlvo.includes(meuPerfil)
||(perfisAlvo.includes("ti")&&(meuPerfil==="ti"||meuPerfil==="coord_ti"))
||(perfisAlvo.includes("marketing")&&(meuPerfil==="marketing"||meuPerfil==="fotografo"))
||(perfisAlvo.includes("coordenador")&&isCoordenador(meuPerfil));
if(m&&m[1]&&_BUILD_ATUAL&&m[1]!==_BUILD_ATUAL&&relevante){
_versaoAvisada=true;
mostrarAvisoNovaVersao();
}
}catch(e){}
}
function mostrarAvisoNovaVersao(){
if(document.getElementById("aviso-nova-versao"))return;
const div=document.createElement("div");
div.id="aviso-nova-versao";
div.style.cssText="position:fixed;z-index:9999;background:#0f4c2b;color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;font-family:'DM Sans',system-ui,sans-serif;font-size:13px;font-weight:600;transform:translate(-50%,-50%);animation:flutuarLento 45s ease-in-out infinite;max-width:min(320px,90vw);flex-wrap:wrap";
div.innerHTML=`<span>🔄 Nova versão disponível</span><button onclick="location.reload()" style="background:#fff;color:#0f4c2b;border:none;border-radius:8px;padding:6px 12px;font-weight:800;cursor:pointer;font-size:12.5px;font-family:inherit">Atualizar</button><button onclick="document.getElementById('aviso-nova-versao').remove()" style="background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:16px;padding:0 2px;line-height:1">✕</button>`;
document.body.appendChild(div);
}
setInterval(checarNovaVersao,30*60*1000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checarNovaVersao();});
window.addEventListener("focus",checarNovaVersao);
setTimeout(checarNovaVersao,20000);
</script>
